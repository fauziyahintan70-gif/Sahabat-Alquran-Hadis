<!DOCTYPE html>
<html lang="id">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Sahabat Al-Qur'an & Hadis</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="chat-container">

    <!-- HEADER -->

    <div class="header">

        <div class="avatar">

            📖

        </div>

        <div class="header-info">

            <div class="title">

                Sahabat Al-Qur'an & Hadis

            </div>

            <div class="status">

                ● online

            </div>

        </div>

    </div>


    <!-- AREA CHAT -->

    <div
        id="chatBox"
        class="chat-box">

    </div>


    <!-- SEDANG MENGETIK -->

    <div
        id="typing"
        class="typing hidden">

        Sahabat Al-Qur'an & Hadis sedang mengetik...

    </div>


    <!-- INPUT -->

    <div class="input-area">

        <input

            id="userInput"

            type="text"

            placeholder="Ketik jawabanmu..."

            autocomplete="off"

        >

        <button id="sendButton">

            Kirim

        </button>

    </div>

</div>

<!-- DATA NODE -->

<script src="nodes.js"></script>

<!-- LOGIKA CHATBOT -->

<script src="script.js"></script>

</body>
</html>
